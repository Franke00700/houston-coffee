name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://houston:houston@127.0.0.1:5432/houston
      DIRECT_URL: postgresql://houston:houston@127.0.0.1:5432/houston
      SESSION_COOKIE_SECURE: "false"
      TRUSTED_ORIGIN: http://localhost:3000
      WEB_CONCURRENCY: "1"
      ORDER_RATE_LIMIT: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
